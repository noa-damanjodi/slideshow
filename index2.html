<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NOA Memories — TV Slideshow</title>
<style>
  :root{ --bg:#000; --brand:#003f88; --accent:#25D366; --muted:#cbd5e1; }
  html,body{height:100%;margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#fff;overflow:hidden}
  #slideshow{position:fixed;inset:0;background:#000;display:block}
  #slideshow img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.06);width:110vw;height:110vh;object-fit:cover;opacity:0;transition:opacity 1.2s ease-in-out;will-change:opacity,transform}
  .kb-zoom-in{animation:kbZoomIn 7s ease-in-out forwards}
  .kb-zoom-out{animation:kbZoomOut 7s ease-in-out forwards}
  @keyframes kbZoomIn{from{transform:translate(-50%,-50%) scale(1.05)}to{transform:translate(-50%,-50%) scale(1.18)}}
  @keyframes kbZoomOut{from{transform:translate(-50%,-50%) scale(1.18)}to{transform:translate(-50%,-50%) scale(1.05)}}

  #overlayTop{position:fixed;left:16px;top:12px;display:flex;align-items:center;gap:12px;z-index:40}
  #logo{height:44px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
  #title{font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #captionBar{position:fixed;left:0;right:0;bottom:40px;padding:10px 22px;display:flex;justify-content:center;z-index:40;pointer-events:none}
  #caption{background:linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,.22));padding:10px 18px;border-radius:8px;font-size:18px;color:#fff;max-width:90%;text-align:center;pointer-events:auto}

  #startOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.75));z-index:60}
  #startBox{background:rgba(255,255,255,0.06);padding:24px;border-radius:12px;text-align:center}
  #startBtn{background:var(--brand);border:0;color:#fff;padding:12px 18px;border-radius:10px;font-size:18px;cursor:pointer}
  #startBtn:focus{outline:2px solid rgba(255,255,255,0.12)}
  #smallHint{margin-top:10px;color:#ddd;font-size:13px}

  #loadingText{position:fixed;left:50%;top:12px;transform:translateX(-50%);color:#ddd;font-size:13px;z-index:50}
  #audioStatus{position:fixed;left:12px;bottom:12px;padding:8px 10px;background:rgba(0,0,0,0.45);border-radius:8px;font-size:13px;z-index:60}
  #meter{width:160px;height:12px;background:rgba(255,255,255,0.06);border-radius:6px;overflow:hidden;margin-top:6px}
  #meterFill{height:100%;width:0%;background:linear-gradient(90deg,#25D366,#003f88)}

  @media(max-width:800px){ #title{font-size:16px} #caption{font-size:16px} }
</style>
</head>
<body>

<!-- audio (controls shown to allow manual play) -->
<audio id="bgmusic" controls loop preload="auto" crossorigin="anonymous">
  <source id="musicSrc" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
</audio>

<div id="loadingText">Loading photos…</div>

<div id="overlayTop" aria-hidden="true">
  <img id="logo" src="https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/noa-logo.png" alt="NOA" onerror="this.style.display='none'">
  <div id="title">NOA Memories</div>
</div>

<div id="slideshow" aria-live="polite"></div>

<div id="captionBar"><div id="caption">Memories — NOA Office</div></div>

<div id="audioStatus">
  <div id="audioText">Audio: idle</div>
  <div id="meter"><div id="meterFill"></div></div>
</div>

<!-- start overlay: extra attributes + inline onclick fallback -->
<div id="startOverlay">
  <div id="startBox">
    <div style="font-size:20px;font-weight:800;margin-bottom:8px;color:#fff">NOA — Memories Slideshow</div>
    <div style="margin-bottom:12px;color:#ddd">Press Start to begin slideshow (this unlocks audio & fullscreen).</div>
    <button id="startBtn" role="button" aria-label="Start Slideshow" tabindex="0" onclick="window.startHandler && window.startHandler(event)">Start Slideshow</button>
    <div id="smallHint">Tip: press OK on your remote. If audio doesn't play, use the audio controls or raise TV volume.</div>
  </div>
</div>

<script>
/* Minimal robust start handling + slideshow + audio meter.
   If Start still doesn't respond, remote may not send expected events — tell me TV model. */

const SLIDE_DURATION = 7000;
const API_URL = "https://script.google.com/macros/s/AKfycby0kXzj0SUHsuC5dow13wukC6L4SUaoP8Jpc_3qW2BaMM_lS1kHUcZ6xAgqRLy76gfo/exec";

const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const bgmusic = document.getElementById('bgmusic');
const musicSrc = document.getElementById('musicSrc');
const audioText = document.getElementById('audioText');
const meterFill = document.getElementById('meterFill');
const loadingText = document.getElementById('loadingText');
const slideshowEl = document.getElementById('slideshow');
const captionEl = document.getElementById('caption');

let started = false;
let photos = [];
let currentIndex = 0;
let slideTimer = null;
let audioCtx = null;
let analyser = null;
let meterAnim = null;

/* helpers */
function log(...args){ console.log('[NOA]', ...args); }
function shuffleArray(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* slideshow DOM */
function buildSlides(){
  slideshowEl.innerHTML = '';
  for(const p of photos){
    const img = document.createElement('img');
    img.src = p.url;
    img.alt = p.caption || 'NOA Memory';
    slideshowEl.appendChild(img);
  }
}
function showSlide(i){
  const imgs = slideshowEl.querySelectorAll('img');
  if(!imgs.length) return;
  imgs.forEach(img=>{ img.style.opacity = 0; img.classList.remove('kb-zoom-in','kb-zoom-out'); });
  const el = imgs[i];
  if(!el) return;
  captionEl.textContent = el.alt || 'NOA Memories';
  if(Math.random() < 0.5) el.classList.add('kb-zoom-in'); else el.classList.add('kb-zoom-out');
  setTimeout(()=> el.style.opacity = 1, 40);
}
function nextSlide(){
  const imgs = slideshowEl.querySelectorAll('img');
  if(!imgs.length) return;
  currentIndex = (currentIndex + 1) % imgs.length;
  showSlide(currentIndex);
}

/* audio analyser */
function createAnalyser(){
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(!analyser){
      const src = audioCtx.createMediaElementSource(bgmusic);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
    }
  } catch(e){ console.warn('analyser failed', e); analyser = null; }
}
function startMeter(){
  if(!analyser) return;
  const data = new Uint8Array(analyser.fftSize);
  function tick(){
    analyser.getByteTimeDomainData(data);
    let sum = 0;
    for(let i=0;i<data.length;i++){ const v = (data[i]-128)/128; sum += v*v; }
    const rms = Math.sqrt(sum/data.length);
    const pct = Math.min(1, rms*5);
    meterFill.style.width = (pct*100) + '%';
    audioText.textContent = pct > 0.03 ? 'Audio: playing' : 'Audio: no audible output';
    meterAnim = requestAnimationFrame(tick);
  }
  if(meterAnim) cancelAnimationFrame(meterAnim);
  meterAnim = requestAnimationFrame(tick);
}
function stopMeter(){ if(meterAnim) cancelAnimationFrame(meterAnim); meterFill.style.width = '0%'; }

/* fetch photos (simple JSONP expecting {photos:[url|{url,caption}]}) */
function loadPhotosJSONP(){
  return new Promise((resolve,reject)=>{
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    window[cb] = data => { delete window[cb]; script.remove(); resolve(data); };
    const script = document.createElement('script');
    script.src = API_URL + '?callback=' + cb + '&_=' + Date.now();
    script.onerror = ()=> reject(new Error('JSONP error'));
    document.body.appendChild(script);
  });
}
async function fetchPhotos(){
  loadingText.style.display = 'block';
  loadingText.textContent = 'Loading photos…';
  try{
    const data = await loadPhotosJSONP();
    let list = [];
    if(data && data.photos && Array.isArray(data.photos)){
      list = data.photos.map(item => (typeof item === 'string') ? {url:item,caption:''} : {url:item.url||item, caption:item.caption||item.title||''});
    }
    if(!list.length){ loadingText.textContent = 'No photos found.'; throw new Error('no photos'); }
    photos = shuffleArray(list);
    buildSlides();
    loadingText.style.display = 'none';
    if(started){ currentIndex = 0; showSlide(0); if(slideTimer) clearInterval(slideTimer); slideTimer = setInterval(nextSlide, SLIDE_DURATION); }
  } catch(err){
    console.warn('fetchPhotos failed', err);
    loadingText.textContent = 'Failed to load photos.';
  }
}

/* start handler (robust): exposed on window for inline onclick fallback */
window.startHandler = async function startHandler(ev){
  if(started) return;
  log('startHandler invoked', ev);

  // create analyser in-gesture
  createAnalyser();
  if(audioCtx && audioCtx.state === 'suspended'){
    try { await audioCtx.resume(); } catch(e){ console.warn('resume failed', e); }
  }

  // attempt play inside gesture
  try {
    bgmusic.currentTime = 0;
    bgmusic.volume = 1.0;
    await bgmusic.play();
    audioText.textContent = 'Audio: play succeeded (checking output...)';
  } catch(e){
    console.warn('play() rejected', e);
    audioText.textContent = 'Audio: play blocked — press Play on the controls or unmute TV';
    bgmusic.controls = true; // show controls so operator can play manually
  }

  // start meter if we have analyser
  if(analyser) {
    startMeter();
    setTimeout(()=>{
      const pct = parseFloat(meterFill.style.width) || 0;
      if(pct < 1){
        audioText.textContent = 'No audible output detected — check TV volume/mute or press Play';
        bgmusic.controls = true;
      }
    }, 900);
  }

  // start visuals immediately
  try { started = true; startOverlay.style.display = 'none'; requestFullscreen(); showSlide(currentIndex); slideTimer = setInterval(nextSlide, SLIDE_DURATION); } catch(e){ console.error(e); }

  // fetch photos in background
  fetchPhotos().catch(e=> console.warn('background fetch failed', e));
};

/* make start react to multiple input types (click, pointerdown, touchstart, key activation) */
function attachStartListeners(){
  // normal click
  startBtn.addEventListener('click', (e)=> window.startHandler && window.startHandler(e));
  // pointer/touch events (some remotes send them)
  startBtn.addEventListener('pointerdown', (e)=> window.startHandler && window.startHandler(e));
  startBtn.addEventListener('touchstart', (e)=> window.startHandler && window.startHandler(e));
  // keyboard activation
  startBtn.addEventListener('keydown', (e)=> {
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); window.startHandler && window.startHandler(e); }
  });
  // global key fallback (remote may only send to window)
  window.addEventListener('keydown', (e)=>{
    if(!started && (e.key === 'Enter' || e.key === 'OK' || e.key === ' ' || e.key === 'Spacebar')) {
      e.preventDefault();
      window.startHandler && window.startHandler(e);
    }
  });
}
// attach when DOM is ready (script placed at end but ensure)
attachStartListeners();

/* audio error fallback */
bgmusic.addEventListener('error', () => {
  console.warn('bgmusic error', bgmusic.error);
  if(musicSrc && musicSrc.src.indexOf('soundhelix') < 0){
    musicSrc.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";
    bgmusic.load();
    audioText.textContent = 'Primary audio failed — switched to fallback.';
  } else {
    audioText.textContent = 'Audio unavailable.';
  }
});

/* warm photos */
fetchPhotos().catch(()=>{});
</script>
</body>
</html>
