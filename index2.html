<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NOA Memories — TV Slideshow</title>
<style>
  :root{
    --bg:#000;
    --brand:#003f88;
    --accent:#25D366;
    --muted:#cbd5e1;
  }
  html,body{height:100%;margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#fff;overflow:hidden}
  #slideshow{position:fixed;inset:0;background:#000;display:block}
  #slideshow img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.06);width:110vw;height:110vh;object-fit:cover;opacity:0;transition:opacity 1.2s ease-in-out;will-change:opacity,transform}
  .kb-zoom-in{animation:kbZoomIn 7s ease-in-out forwards}
  .kb-zoom-out{animation:kbZoomOut 7s ease-in-out forwards}
  @keyframes kbZoomIn{from{transform:translate(-50%,-50%) scale(1.05)}to{transform:translate(-50%,-50%) scale(1.18)}}
  @keyframes kbZoomOut{from{transform:translate(-50%,-50%) scale(1.18)}to{transform:translate(-50%,-50%) scale(1.05)}}

  /* branding + caption overlay */
  #overlayTop{position:fixed;left:16px;top:12px;display:flex;align-items:center;gap:12px;z-index:40}
  #logo{height:44px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}
  #title{font-weight:800;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  #captionBar{position:fixed;left:0;right:0;bottom:40px;padding:10px 22px;display:flex;justify-content:center;z-index:40;pointer-events:none}
  #caption{background:linear-gradient(90deg, rgba(0,0,0,.45), rgba(0,0,0,.22));padding:10px 18px;border-radius:8px;font-size:18px;color:#fff;max-width:90%;text-align:center;pointer-events:auto}

  /* start overlay (required to allow audio & fullscreen on many TVs) */
  #startOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.75));z-index:60}
  #startBox{background:rgba(255,255,255,0.06);padding:24px;border-radius:12px;text-align:center}
  #startBtn{background:var(--brand);border:0;color:#fff;padding:12px 18px;border-radius:10px;font-size:18px;cursor:pointer}
  #smallHint{margin-top:10px;color:#ddd;font-size:13px}

  /* loading & audio status */
  #loadingText{position:fixed;left:50%;top:12px;transform:translateX(-50%);color:#ddd;font-size:13px;z-index:50}
  #audioStatus{position:fixed;left:12px;bottom:12px;padding:8px 10px;background:rgba(0,0,0,0.45);border-radius:8px;font-size:13px;z-index:60}
  #meter{width:160px;height:12px;background:rgba(255,255,255,0.06);border-radius:6px;overflow:hidden;margin-top:6px}
  #meterFill{height:100%;width:0%;background:linear-gradient(90deg,#25D366,#003f88)}

  /* controls */
  #controls{position:fixed;right:12px;top:12px;z-index:50;display:flex;flex-direction:column;gap:8px}
  .ctl{background:rgba(255,255,255,0.06);color:#fff;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);cursor:pointer;font-size:13px}

  @media(max-width:800px){
    #title{font-size:16px}
    #caption{font-size:16px}
  }
</style>
</head>
<body>

<!-- Audio (primary) -->
<!-- Controls shown by default to allow manual play if automatic play is blocked -->
<audio id="bgmusic" controls loop preload="auto" crossorigin="anonymous">
  <source id="musicSrc" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  <!-- Replace the src above with your hosted MP3 if you have one -->
  Your browser does not support the audio element.
</audio>

<div id="loadingText">Loading photos…</div>

<!-- branding / title -->
<div id="overlayTop" aria-hidden="true">
  <img id="logo" src="https://raw.githubusercontent.com/08electricaldata/08electricaldata-json/main/master/noa-logo.png" alt="NOA" onerror="this.style.display='none'">
  <div id="title">NOA Memories</div>
</div>

<!-- main slideshow container -->
<div id="slideshow" aria-live="polite"></div>

<!-- caption -->
<div id="captionBar"><div id="caption">Memories — NOA Office</div></div>

<!-- audio status & simple meter -->
<div id="audioStatus">
  <div id="audioText">Audio: idle</div>
  <div id="meter"><div id="meterFill"></div></div>
</div>

<!-- small hidden dev controls (optional) -->
<div id="controls" style="display:none">
  <button class="ctl" id="muteBtn">Mute</button>
  <button class="ctl" id="refreshBtn">Refresh List</button>
</div>

<!-- start overlay (user gesture unlock for autoplay & fullscreen) -->
<div id="startOverlay">
  <div id="startBox">
    <div style="font-size:20px;font-weight:800;margin-bottom:8px;color:#fff">NOA — Memories Slideshow</div>
    <div style="margin-bottom:12px;color:#ddd">Press Start to begin slideshow (this unlocks audio & fullscreen).</div>
    <button id="startBtn">Start Slideshow</button>
    <div id="smallHint">Tip: press OK on your remote. If audio doesn't play, use the audio controls or raise TV volume.</div>
  </div>
</div>

<script>
/* ===========================
   Config
   =========================== */
const API_URL = "https://script.google.com/macros/s/AKfycby0kXzj0SUHsuC5dow13wukC6L4SUaoP8Jpc_3qW2BaMM_lS1kHUcZ6xAgqRLy76gfo/exec";
const SLIDE_DURATION = 7000;
const REFRESH_INTERVAL_MINUTES = 10;
const MAX_DISPLAY_CHARS = 120;
const FALLBACK_AUDIO = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3";

/* ===========================
   State & elements
   =========================== */
let photos = [];
let currentIndex = 0;
let slideTimer = null;
let started = false;

const slideshowEl = document.getElementById('slideshow');
const loadingText = document.getElementById('loadingText');
const startOverlay = document.getElementById('startOverlay');
const startBtn = document.getElementById('startBtn');
const captionEl = document.getElementById('caption');
const bgmusic = document.getElementById('bgmusic');
const musicSrc = document.getElementById('musicSrc');
const audioText = document.getElementById('audioText');
const meterFill = document.getElementById('meterFill');

let audioCtx = null;
let analyser = null;
let meterAnimation = null;

/* ===========================
   Helpers
   =========================== */
function log(...args){ console.log('[slideshow]', ...args); }
function safeTrimCaption(text){
  if(!text) return '';
  text = text.trim();
  return text.length <= MAX_DISPLAY_CHARS ? text : text.slice(0, MAX_DISPLAY_CHARS-3) + '...';
}
function shuffleArray(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ===========================
   Build slides
   =========================== */
function buildSlideshowDOM(){
  slideshowEl.innerHTML = '';
  for(const p of photos){
    const img = document.createElement('img');
    img.dataset.src = p.url;
    img.alt = p.caption || 'NOA Memory';
    img.src = p.url;
    slideshowEl.appendChild(img);
  }
}
function showSlide(i){
  const imgs = slideshowEl.querySelectorAll('img');
  if(imgs.length === 0) return;
  imgs.forEach(img=>{
    img.style.opacity = 0;
    img.classList.remove('kb-zoom-in','kb-zoom-out');
  });
  const el = imgs[i];
  if(!el) return;
  captionEl.innerText = safeTrimCaption(el.alt || "NOA Memories");
  if(Math.random() < 0.5) el.classList.add('kb-zoom-in'); else el.classList.add('kb-zoom-out');
  setTimeout(()=> el.style.opacity = 1, 40);
}
function nextSlide(){
  const imgs = slideshowEl.querySelectorAll('img');
  if(imgs.length === 0) return;
  currentIndex = (currentIndex + 1) % imgs.length;
  showSlide(currentIndex);
}

/* ===========================
   Fullscreen
   =========================== */
function requestFullscreen(){
  const el = document.documentElement;
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if(el.mozRequestFullScreen) el.mozRequestFullScreen();
  else if(el.msRequestFullscreen) el.msRequestFullscreen();
}

/* ===========================
   Fetch photos (JSONP)
   =========================== */
function loadPhotosJSONP(){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1000);
    window[cb] = function(data){
      delete window[cb];
      script.remove();
      resolve(data);
    };
    const script = document.createElement('script');
    script.src = API_URL + '?callback=' + cb + '&_=' + Date.now();
    script.onerror = function(){ reject(new Error('JSONP load error')); };
    document.body.appendChild(script);
  });
}
async function fetchAndRefreshPhotos(){
  loadingText.style.display = 'block';
  loadingText.innerText = 'Loading photos…';
  try{
    const data = await loadPhotosJSONP();
    let list = [];
    if(data && data.photos){
      if(Array.isArray(data.photos) && data.photos.length){
        list = data.photos.map(item => {
          if(typeof item === 'string') return { url: item, caption: ''};
          return { url: item.url || item, caption: item.caption || item.title || '' };
        });
      }
    }
    if(list.length === 0){
      loadingText.innerText = 'No photos found.';
      throw new Error('no photos');
    }
    list = shuffleArray(list);
    const preloadPromises = list.slice(0, 60).map(p => new Promise((res) => {
      const img = new Image();
      img.onload = () => res(p.url);
      img.onerror = () => { console.warn('image failed preload', p.url); res(null); };
      img.src = p.url;
    }));
    await Promise.race([ Promise.all(preloadPromises), new Promise(r => setTimeout(r, 6000)) ]);
    photos = list;
    buildSlideshowDOM();
    loadingText.style.display = 'none';
    if(started){
      if(slideTimer) clearInterval(slideTimer);
      currentIndex = 0;
      showSlide(0);
      slideTimer = setInterval(nextSlide, SLIDE_DURATION);
    }
    return photos;
  } catch(err){
    console.error(err);
    loadingText.innerText = 'Failed to load photos. Check API.';
    throw err;
  }
}

/* ===========================
   Audio: create analyser (must be inside user gesture for many browsers)
   =========================== */
function createAudioAnalyser(){
  try {
    if(!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(!analyser){
      const srcNode = audioCtx.createMediaElementSource(bgmusic);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      srcNode.connect(analyser);
      analyser.connect(audioCtx.destination);
    }
  } catch (e) {
    console.warn('AudioContext/analyser create failed', e);
    analyser = null;
  }
}

function startMeter(){
  if(!analyser) return;
  const data = new Uint8Array(analyser.fftSize);
  function tick(){
    analyser.getByteTimeDomainData(data);
    // compute RMS-ish value
    let sum = 0;
    for(let i=0;i<data.length;i++){
      const v = (data[i]-128)/128;
      sum += v*v;
    }
    const rms = Math.sqrt(sum/data.length);
    const pct = Math.min(1, rms*5); // scale to visible range
    meterFill.style.width = (pct*100) + '%';
    audioText.innerText = pct > 0.03 ? 'Audio: playing' : 'Audio: no audible output';
    meterAnimation = requestAnimationFrame(tick);
  }
  if(meterAnimation) cancelAnimationFrame(meterAnimation);
  meterAnimation = requestAnimationFrame(tick);
}
function stopMeter(){
  if(meterAnimation) cancelAnimationFrame(meterAnimation);
  meterFill.style.width = '0%';
}

/* ===========================
   Start behavior (in-gesture operations)
   =========================== */
startBtn.addEventListener('click', async function(ev){
  console.log('Start pressed');

  // Create AudioContext & analyser inside gesture (required by some browsers)
  createAudioAnalyser();

  // Try to resume AudioContext if suspended (Chrome)
  if(audioCtx && audioCtx.state === 'suspended'){
    try { await audioCtx.resume(); } catch(e){ console.warn('audioCtx.resume failed', e); }
  }

  // Attempt to play audio inside the gesture
  try {
    bgmusic.currentTime = 0;
    bgmusic.volume = 1.0;
    await bgmusic.play();
    audioText.innerText = 'Audio: play() succeeded (checking output...)';
  } catch(e){
    console.warn('bgmusic.play() rejected', e);
    audioText.innerText = 'Audio: play blocked — press Play on controls or unmute TV';
    // show controls to allow manual play
    bgmusic.controls = true;
  }

  // Start analyser meter if created
  if(analyser) {
    startMeter();
    // after a short delay, check level; if still silent, show hint
    setTimeout(() => {
      // read current width as indicator
      const pct = parseFloat(meterFill.style.width) || 0;
      if(pct < 1){ // near zero
        audioText.innerText = 'No audible output detected — please check TV volume/mute or press Play on the audio controls.';
        bgmusic.controls = true;
      }
    }, 900);
  }

  // Start slideshow visuals immediately (don't block on fetch)
  try { startSlideshow(); } catch(e){ console.error('startSlideshow error', e); }

  // Fetch photos in background (non-blocking)
  fetchAndRefreshPhotos().then(() => log('photos loaded')).catch(err=> console.warn('photo fetch failed', err));
});

/* keyboard remote friendly: Enter/OK triggers start overlay if visible */
window.addEventListener('keydown', (ev) => {
  if(!started && (ev.key === 'Enter' || ev.key === 'OK' || ev.key === ' ' || ev.key === 'Spacebar')) {
    startBtn.click();
  }
});

/* fallback if audio source errors (404 etc.) */
bgmusic.addEventListener('error', () => {
  console.warn('bgmusic error', bgmusic.error);
  if(musicSrc && musicSrc.src !== FALLBACK_AUDIO){
    musicSrc.src = FALLBACK_AUDIO;
    bgmusic.load();
    audioText.innerText = 'Primary audio failed — switched to fallback.';
  } else {
    audioText.innerText = 'Audio unavailable (source missing or not supported).';
  }
});

/* warm photos list */
fetchAndRefreshPhotos().catch(()=>{ /* ignore */ });

/* Optional: mute/unmute control wiring for debugging (show it by setting display) */
const muteBtn = document.getElementById('muteBtn');
if(muteBtn){
  muteBtn.addEventListener('click', () => {
    if(!bgmusic) return;
    bgmusic.muted = !bgmusic.muted;
    muteBtn.innerText = bgmusic.muted ? 'Unmute' : 'Mute';
    if(!bgmusic.muted && bgmusic.paused){
      bgmusic.play().catch(()=>{});
    }
  });
}
</script>
</body>
</html>
